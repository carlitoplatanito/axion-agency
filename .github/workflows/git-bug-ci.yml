name: git-bug verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-git-bug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'

      - name: Verify git-bug integrity
        run: |
          go install github.com/git-bug/git-bug@latest
          export PATH="$HOME/go/bin:$PATH"
          git bug bug || git bug ls || true
